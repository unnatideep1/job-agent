# Example tailoring file. One per application, written by the Writer, checked by Tod.
target:
  company: Example Target
  role: Group Product Manager, AI
  url: https://example.com/jobs/123
output_name: Alex_Rivera_Resume_ExampleTarget_GPM

summary: >-
  Product manager with <b>8 years</b> in B2B SaaS, leading AI products from 0→1 and holding them to measurable quality bars.

strengths_title: Core Strengths
strengths: [AI evaluation & quality, 0→1 product development, B2B SaaS growth]   # only from strengths_library

# Bullet order per role: a list per section. The scope (first) bullet is always kept first.
order:
  ex_senior: [[ex_scope, ex_eval]]

# Reword existing bullets in the JD's language. Every number must survive unchanged.
rewrites:
  ex_scope:
    text: "Own the AI assistant used by 2,000 business customers on an enterprise B2B plan, from strategy to launch."
    why: "JD says 'enterprise customers'; mapped by intent (see keywords), number unchanged"
  ex_eval:
    text: "Built an AI evaluation suite that cut bad answers by <b>40%</b> before each release."
    why: "JD asks for 'AI quality and evaluation'; same fact, JD's wording"

# New bullets from facts the candidate confirmed (confirmed_additions ids in the master file).
# Numbers in the text must appear in that confirmed fact.
additions:
  ex_senior:
    - from: ab_tests
      section: 0
      after: ex_eval
      text: "Ran weekly A/B tests on assistant prompts and onboarding flows."

omit: []          # bullet ids to leave out (never a scope bullet), e.g. to fit 2 pages
date_style: inline   # default. 'right' right-aligns dates; the builder falls back to inline if parsers would misread it

# JD keywords, mapped by intent to the master file. The builder refuses a keyword in a rewrite, addition or summary
# unless its source says it, or this list maps that source to it (evidence + stretch). ats_check.py reports coverage.
keywords:
  - term: AI evaluation
    priority: must
    aliases: [evals, model evaluation]
    evidence: [ex_eval]
    stretch: "the evaluation suite tests the AI assistant's answers (role: Senior PM, AI Assistant)"
  - term: experimentation
    priority: core
    aliases: [A/B tests, A/B testing]
    evidence: [ab_tests]
  - term: enterprise customers
    priority: core
    aliases: [enterprise B2B, enterprise]
    evidence: [ex_scope]
    stretch: "the 2,000 customers are businesses buying a B2B product; Tod: check the plan really is sold to enterprises"
  - term: pricing
    priority: nice
    aliases: [monetization, usage-based billing]
    evidence: [ex_billing]
  - term: agent platforms
    priority: core                # nothing in the master backs this: the Writer drafts a proposal (see proposals.yaml)
