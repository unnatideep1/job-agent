# Company job boards the Scout can scan, adapted from the portal-catalog idea in career-ops
# (https://github.com/career-ops-hq/career-ops, MIT). Every board below answered its public JSON API
# with at least one open job on 2026-11-19. Boards move: scout.py reports any that fail, and
# you can add your own under `sources:` in job_preferences.yaml.
#
# Pick companies by tag in job_preferences.yaml, e.g.  catalog: {tags: [ai, fintech]}
# Tags: agtech, ai, consumer, data, defense, design, devtools, edtech, fintech, gaming, hardware, health, infra, logistics, media, robotics, saas, security
